<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classic Snake Game</title>
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      height: 100vh;
      justify-content: center;
    }
    #gameArea {
      background: #111;
      border: 5px solid #3a3;
      box-shadow: 0 0 16px #080;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    #score {
      font-size: 1.5em;
      margin-bottom: 8px;
      color: #3a3;
      letter-spacing: 1px;
    }
    #instructions {
      color: #bbb;
      margin-top: 8px;
      font-size: 1em;
    }
    #gameover {
      color: #f33;
      font-size: 2em;
      display: none;
      margin-top: 10px;
      font-weight: bold;
    }
    #restartBtn {
      background: #3a3;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 1.2em;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
    #restartBtn:hover { background: #292; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameArea" width="400" height="400"></canvas>
  <div id="gameover">Game Over!</div>
  <button id="restartBtn">Restart</button>
